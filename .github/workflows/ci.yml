name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restauration des dépendances
        run: dotnet restore

      - name: Compilation
        run: dotnet build --no-restore --configuration Release

      - name: Tests avec couverture de code
        run: dotnet test --no-build --configuration Release --collect "XPlat Code Coverage" --results-directory ./coverage

      - name: Installation de ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Génération du rapport de couverture HTML
        run: reportgenerator -reports:"./coverage/**/coverage.cobertura.xml" -targetdir:"./coverage/report" -reporttypes:"Html;TextSummary"

      - name: Affichage du résumé de couverture
        run: cat ./coverage/report/Summary.txt

      - name: Publication du rapport comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/report
